<style>
/* Layout: a game-style shell. Title screen, then five tabs (adventure scene + board, kids, behaviours, round, certificates).
   Every surface is a notched pixel panel; the maps and certificates are fixed-palette pixel art. */
:root{
  --bg:#dcefee; --grid:#cfe6e4; --surface:#ffffff; --surface2:#eef8f7; --sky:#bfe6f7;
  --ink:#10303a; --muted:#46686f; --line:#10303a; --soft:#b6d6d3;
  --brand:#0a8f68; --brand-ink:#ffffff; --gold:#f4b400; --gold-ink:#2e2200;
  --pos:#0c7a50; --pos-bg:#d6f2e4; --neg:#b8302a; --neg-bg:#fde0dd; --shade:rgba(16,48,58,.2);
  --f-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --f-body:'Tajawal','Segoe UI',system-ui,sans-serif;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;
  --sline:#0e2a33;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b23; --grid:#112430; --surface:#162d38; --surface2:#1c3a47; --sky:#2a5a74;
    --ink:#e6f4f2; --muted:#9cc0c4; --line:#7fd6c8; --soft:#2c4d59;
    --brand:#37d69a; --brand-ink:#05261b; --gold:#ffc83d; --gold-ink:#2e2200;
    --pos:#5ee0a8; --pos-bg:#14402f; --neg:#ff8d84; --neg-bg:#4a1f22; --shade:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1b23; --grid:#112430; --surface:#162d38; --surface2:#1c3a47; --sky:#2a5a74;
  --ink:#e6f4f2; --muted:#9cc0c4; --line:#7fd6c8; --soft:#2c4d59;
  --brand:#37d69a; --brand-ink:#05261b; --gold:#ffc83d; --gold-ink:#2e2200;
  --pos:#5ee0a8; --pos-bg:#14402f; --neg:#ff8d84; --neg-bg:#4a1f22; --shade:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@font-face{font-family:HJ;font-weight:800;font-style:normal;font-display:swap;src:url(fonts/Handjet-800.woff) format("woff")}
body{margin:0;background-color:var(--bg);color:var(--ink);font:500 16px/1.65 var(--f-body);direction:rtl;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h2{font:400 30px/1.25 var(--f-display);text-wrap:balance}
h3{font:800 18px/1.4 var(--f-body)}
.sub{color:var(--muted);font-size:14px}
:focus-visible{outline:3px dashed var(--gold);outline-offset:4px}
[hidden]{display:none!important}

/* notched pixel surfaces */
.panel,.bar,.sw,.field,.btn,.tag,.map-card,.actor-card{--n:4px}
.panel{background:var(--surface);margin:4px;padding:16px 18px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),0 8px 0 0 var(--shade)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 20px;margin:4px;border:0;
  background:var(--btn-bg,var(--surface2));color:var(--btn-ink,var(--ink));font:800 16px/1.2 var(--f-body);text-align:center;text-decoration:none;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),inset 0 -5px 0 0 rgba(0,0,0,.18)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{--btn-bg:var(--brand);--btn-ink:var(--brand-ink)}
.btn.gold{--btn-bg:var(--gold);--btn-ink:var(--gold-ink)}
.btn.neg{--btn-bg:var(--neg-bg);--btn-ink:var(--neg)}
.btn.pos{--btn-bg:var(--pos-bg);--btn-ink:var(--pos)}
.btn.small{min-height:38px;padding:4px 14px;font-size:14px}
.btn.armed{--btn-bg:var(--neg);--btn-ink:#fff}
.field{display:block;min-width:0;width:calc(100% - 8px);margin:4px;padding:10px 12px;border:0;background:var(--surface2);color:var(--ink);font-size:16px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
label.lbl{display:block;font-weight:800;margin:14px 4px 4px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ico{display:inline-block;width:24px;height:24px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}
.chip{display:inline-block;font:400 12px/1 var(--f-pixel);padding:7px 8px;background:var(--pos-bg);color:var(--pos);white-space:nowrap;direction:ltr}
.chip.neg{background:var(--neg-bg);color:var(--neg)}
.chip.gold{background:var(--gold);color:var(--gold-ink)}

/* shell */
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:6px 130px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font:400 36px/1 var(--f-display);text-shadow:3px 3px 0 var(--gold)}
.brand .bt{display:flex;flex-direction:column;align-items:center;gap:3px}
.brand .bt small{font:800 17px/1 'HJ',sans-serif;direction:ltr;color:var(--ink,#0e2a33);text-shadow:none;letter-spacing:.03em}
.brand .ico{width:30px;height:30px;color:var(--gold);filter:drop-shadow(2px 2px 0 var(--line))}
.iconbtn{width:48px;height:48px;padding:0;min-height:0}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -4px 0 0 var(--line)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:transparent;color:var(--muted);font:800 12px/1.2 var(--f-body)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.view{animation:rise .25s steps(4) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:820px){
  .tabs{justify-content:center}
  .tab{flex:0 1 190px;flex-direction:row;justify-content:center;gap:8px;font-size:16px;padding:8px 6px}
}

/* title screen */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;background:#4fb8ec;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(7vh + env(safe-area-inset-top,0px)) 20px calc(2.5vh + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .35s steps(5),visibility .35s}
#splash.gone{opacity:0;visibility:hidden}
#splashCv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#splash .ttl,#splash .go{position:relative}
.langpick{position:relative;margin:14px auto 0;width:max-content;max-width:100%}
#langBtn{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;color:#0e2a33;border:3px solid #0e2a33;box-shadow:0 4px 0 #0e2a33;font:700 14px/1 var(--f-body);white-space:nowrap}
#langBtn .en{font:800 18px/1 'HJ',sans-serif;direction:ltr;letter-spacing:.02em}
#langBtn i{font-style:normal;opacity:.5}
#langBtn b{font-size:12px;transition:transform .15s}
#langBtn[aria-expanded=true] b{transform:rotate(180deg)}
#langBtn:focus-visible,.langmenu button:focus-visible{outline:3px solid #0e2a33;outline-offset:2px}
.langmenu{position:absolute;bottom:calc(100% + 10px);left:0;right:0;display:flex;flex-direction:column;background:#fff;border:3px solid #0e2a33;box-shadow:0 4px 0 #0e2a33}
.langmenu[hidden]{display:none}
.langmenu button{all:unset;cursor:pointer;padding:12px 14px;text-align:center;font:700 18px/1 var(--f-body);color:#0e2a33}
.langmenu button[data-v=en]{font:800 22px/1 'HJ',sans-serif;direction:ltr}
.langmenu button+button{border-top:3px solid #0e2a33}
.langmenu button[aria-pressed=true]{background:#ffd23f;cursor:default}
.ttl h1{margin:0;font:400 clamp(64px,19vw,128px)/1.05 var(--f-display);white-space:nowrap;color:#ffd23f;text-shadow:0 5px 0 #0e2a33,5px 5px 0 #0e2a33,-5px 5px 0 #0e2a33,0 -5px 0 #0e2a33,5px 0 0 #0e2a33,-5px 0 0 #0e2a33,4px 4px 0 #0e2a33,-4px -4px 0 #0e2a33,4px -4px 0 #0e2a33,-4px 4px 0 #0e2a33}
.ttl .sub-en{margin-top:6px;font:800 clamp(50px,14vw,84px)/1 'HJ',sans-serif;color:#fff;direction:ltr;letter-spacing:.02em;text-shadow:0 4px 0 #0e2a33,4px 4px 0 #0e2a33,-4px 4px 0 #0e2a33,0 -4px 0 #0e2a33,4px 0 0 #0e2a33,-4px 0 0 #0e2a33,3px 3px 0 #0e2a33,-3px -3px 0 #0e2a33,3px -3px 0 #0e2a33,-3px 3px 0 #0e2a33}
.ttl p{margin:14px auto 0;max-width:86%;font:800 clamp(17px,4.6vw,24px)/1.5 var(--f-body);color:#fff;text-shadow:2px 2px 0 #0e2a33}
html[dir=ltr] .ttl p{font:800 clamp(20px,5.4vw,28px)/1.15 'HJ',sans-serif;letter-spacing:.02em;max-width:84%}
.go .btn{font-size:22px;padding:12px 34px;min-height:60px;--btn-bg:#ffd23f;--btn-ink:#2e2200;--line:#0e2a33}
.go small{display:block;margin-top:10px;color:#fff;font-weight:700;text-shadow:2px 2px 0 #0e2a33}

/* home: the map fills the whole screen above the tab bar */
body.is-home{overflow:hidden}
body.is-home #app{max-width:none;padding:0}
body.is-home .brand{display:none}
body.is-home .top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;z-index:16;padding:0}
body.is-home .top .iconbtn{width:44px;height:44px;--line:#0e2a33}
.home{position:fixed;left:0;right:0;top:0;bottom:var(--tabH,78px);overflow:hidden;background:#222;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cam{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.cam::-webkit-scrollbar{display:none}
.scene{position:relative;width:100%;overflow:hidden}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.actors{position:absolute;inset:0}
.hud{position:absolute;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;max-width:52%;pointer-events:none}
.hud .pill{margin:0;pointer-events:auto;background:var(--surface);color:var(--ink);box-shadow:0 -2px 0 0 var(--sline),0 2px 0 0 var(--sline),-2px 0 0 0 var(--sline),2px 0 0 0 var(--sline)}
.hud .pill.hm,.hud .pill.warn{background:var(--gold);color:var(--gold-ink)}
.hud button.pill{border:0;cursor:pointer;font-family:inherit}
.hud .pill.hm::after{content:"";display:inline-block;margin-inline-start:8px;border:5px solid transparent;border-top-color:currentColor;border-bottom:0;vertical-align:2px}
.hud .pill.hm[aria-expanded=true]::after{border-top:0;border-bottom:5px solid currentColor}
.homebtn{position:absolute;z-index:6;left:10px;bottom:12px;width:44px;height:44px;margin:0;--line:#0e2a33}
body.is-home #homeBtn2{display:none}
.top .tools{display:flex;gap:8px;align-items:center}
.camctl{position:absolute;z-index:6;left:10px;top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.camctl .iconbtn{width:44px;height:44px;margin:0;--line:#0e2a33}
.home-empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));z-index:5}
.actor{position:absolute;left:0;top:0;width:var(--aw,8%);transform:translate(-50%,-100%);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline-offset:6px}
.actor::before{content:"";position:absolute;inset:-10px -12px -4px}
.actor img{display:block;width:100%;image-rendering:pixelated}
.actor::after{content:"";position:absolute;left:12%;right:12%;bottom:-2px;height:4px;background:rgba(0,0,0,.3)}
.actor.sel img{filter:drop-shadow(2px 0 0 #ffd23f) drop-shadow(-2px 0 0 #ffd23f) drop-shadow(0 2px 0 #ffd23f) drop-shadow(0 -2px 0 #ffd23f)}
.actor .tag{position:absolute;bottom:calc(100% + 2px + var(--tl,0px));left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--ink);font:800 11px/1.25 var(--f-body);padding:1px 6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  box-shadow:0 -2px 0 0 var(--sline),0 2px 0 0 var(--sline),-2px 0 0 0 var(--sline),2px 0 0 0 var(--sline)}
.actor.idle img{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.wt-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.wt{margin:2px;width:calc(100% - 4px);padding-bottom:6px}
.wt canvas{aspect-ratio:200/280}
.wt b{font-size:12px;padding:5px 2px 2px}
.wt.on{box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold),0 0 14px 4px rgba(255,210,63,.55)}
.wt.off canvas{filter:grayscale(1) brightness(.55);opacity:.32}
.wt.off b{opacity:.45}
.wt .wtb{display:block;width:calc(100% - 8px);margin:4px 4px 0;padding:6px 4px;font-size:12px;line-height:1.3}
.wt small{padding-bottom:2px}
/* treasure chests */
.stn{position:absolute;z-index:3;pointer-events:none;white-space:nowrap;font:800 12px/1.25 Tajawal,sans-serif;color:#7a0a18;background:rgba(255,255,255,.92);border:1.5px solid #ce1126;border-radius:9px;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}.stn.r{transform:translate(0,-50%)}.stn.l{transform:translate(-100%,-50%)}.stn.c{transform:translate(-50%,-50%)}.stn.sm{font-size:8px;padding:0 4px;background:#2f8f5a;color:#fff;border-color:#fff;border-width:1px;border-radius:6px}.stn.ttl{font-size:14px;background:#ce1126;color:#fff;border-color:#fff;padding:1px 10px}
.chest{position:absolute;transform:translate(-50%,-100%);pointer-events:none;transform-origin:50% 100%}
.chest img{display:block;width:100%;image-rendering:pixelated}
.chest::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-2px;height:3px;background:rgba(0,0,0,.2)}
.chest:not(.poof) img{animation:chglint 2.4s steps(1) infinite}
@keyframes chglint{0%,86%{filter:none}90%,96%{filter:brightness(1.35)}}
.chest.bump img{animation:chbump .6s steps(6)}
@keyframes chbump{0%{transform:scale(1)}25%{transform:scale(1.45);filter:brightness(2)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.chest.poof img{animation:chpoof .6s steps(6) forwards}
@keyframes chpoof{0%{transform:scale(1)}30%{transform:scale(1.5);filter:brightness(2.2)}100%{transform:scale(2.4);opacity:0}}
.chest-win{text-align:center;padding:6px 2px 4px}
.chest-stage{position:relative;max-width:420px;margin:0 auto;box-shadow:0 -4px 0 0 var(--sline),0 4px 0 0 var(--sline),-4px 0 0 0 var(--sline),4px 0 0 0 var(--sline);overflow:hidden}
.chest-cv{display:block;width:100%;height:auto;image-rendering:pixelated;background:#7ad0ff}
.chest-boom{position:absolute;left:50%;top:14%;transform:translate(-50%,0) scale(.2);font:400 40px/1 var(--f-display);color:#fff3b0;text-shadow:3px 3px 0 #b8302a,-3px 3px 0 #b8302a,3px -3px 0 #b8302a,-3px -3px 0 #b8302a;opacity:0;pointer-events:none;white-space:nowrap}
.chest-boom.go{animation:chboom 1.1s steps(11) forwards}
@keyframes chboom{0%{opacity:1;transform:translate(-50%,0) scale(.3)}25%{opacity:1;transform:translate(-50%,-8px) scale(1.3)}60%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.chest-txt{margin-top:16px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
.chest-txt.show{opacity:1;transform:none}
.chest-title{font:400 30px/1.3 var(--f-display);color:var(--brand);text-wrap:balance}
.chest-prize{margin:10px auto 0;max-width:360px;padding:12px 14px;background:var(--surface2);box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold)}
.chest-prize small{display:block;font:700 13px/1.4 var(--f-body);color:var(--muted)}
.chest-prize b{display:block;font:800 24px/1.4 var(--f-body);overflow-wrap:anywhere}
.rw-row{display:flex;gap:8px;align-items:center}.rw-row .field{flex:1;min-width:0}
/* + and - beside the selected character */
.pm{position:absolute;inset:0;pointer-events:none}
.pb{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;padding:0;border:0;pointer-events:auto;color:#fff;animation:pbin .18s steps(3) both;
  box-shadow:0 -4px 0 0 var(--sline),0 4px 0 0 var(--sline),-4px 0 0 0 var(--sline),4px 0 0 0 var(--sline),inset 0 -5px 0 0 rgba(0,0,0,.22)}
.pb.pos{left:calc(100% + 10px);background:#25b866}
.pb.neg{right:calc(100% + 10px);background:#e24a3b}
.pb:active{transform:translateY(3px)}
.pb::before,.pb::after{content:"";position:absolute;background:currentColor;left:12px;right:12px;top:50%;height:6px;margin-top:-4px}
.pb.pos::after{left:50%;right:auto;top:12px;bottom:12px;height:auto;width:6px;margin:0 0 0 -3px}
.pb.neg::after{display:none}
.pb.cert{width:auto;min-width:46px;padding:0 12px;background:var(--gold);color:var(--gold-ink);font:800 14px/1 var(--f-body);white-space:nowrap}

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

/* ---------- pixel primitives (logical pixels) ---------- */
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function disc(c,cx,cy,r,col){r=Math.round(r);cx=Math.round(cx);cy=Math.round(cy);c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.round(Math.sqrt(Math.max(0,r*r+r*0.5-dy*dy)));c.fillRect(cx-w,cy+dy,w*2+1,1);}}
function ell(c,cx,cy,rx,ry,col){cx=Math.round(cx);cy=Math.round(cy);rx=Math.round(rx);ry=Math.round(ry);c.fillStyle=col;for(let dy=-ry;dy<=ry;dy++){const t=1-(dy*dy)/((ry+0.5)*(ry+0.5));const w=Math.round(rx*Math.sqrt(Math.max(0,t)));c.fillRect(cx-w,cy+dy,w*2+1,1);}}
function tri(c,cx,top,h,hb,colL,colR){cx=Math.round(cx);top=Math.round(top);h=Math.max(1,Math.round(h));for(let i=0;i<=h;i++){const w=Math.round(hb*i/h);c.fillStyle=colL;c.fillRect(cx-w,top+i,w+1,1);c.fillStyle=colR||colL;c.fillRect(cx+1,top+i,w,1);}}
function diamond(c,cx,cy,hw,hh,l,d){cx=Math.round(cx);cy=Math.round(cy);for(let i=-hh;i<=hh;i++){const w=Math.round(hw*(1-Math.abs(i)/(hh+0.5)));R(c,cx-w,cy+i,w+1,1,l);if(w>0)R(c,cx+1,cy+i,w,1,d);}}
function spr(c,rows,x,y,pal,s){s=s||1;for(let j=0;j<rows.length;j++){const row=rows[j];for(let i=0;i<row.length;i++){const ch=row[i];if(ch==='.'||ch===' ')continue;const col=pal[ch];if(!col)continue;c.fillStyle=col;c.fillRect(Math.round(x)+i*s,Math.round(y)+j*s,s,s);}}}
let REC=null;
function sky(c,W,H,cols,h){if(REC)REC.sky.push(...cols);const bh=Math.ceil(h/cols.length);R(c,0,0,W,H,cols[cols.length-1]);cols.forEach((col,i)=>{R(c,0,i*bh,W,bh+1,col);});
  for(let i=1;i<cols.length;i++){const y=i*bh;for(let x=(i&1);x<W;x+=2){R(c,x,y,1,1,cols[i-1]);R(c,x+1-(i&1)*0,y+1,1,1,cols[i-1]);}}}

function cloud(c,x,y,s){if(REC){REC.clouds.push([x,y,s]);return;}const w='#ffffff',sh='#d6e8f4';disc(c,x,y,3*s,w);disc(c,x+4*s,y-s,4*s,w);disc(c,x+9*s,y,3*s,w);R(c,x-2*s,y,13*s,2*s,w);R(c,x-2*s,y+2*s,13*s,1,sh);}

function plus(c,x,y,col){R(c,x,y-1,1,3,col);R(c,x-1,y,3,1,col);}

function tree(c,x,by,s){s=s||1;R(c,x-s,by-4*s,2*s,4*s,'#6b4a2b');disc(c,x,by-8*s,4*s,'#2e8b3d');disc(c,x-2*s,by-7*s,3*s,'#3fa04b');disc(c,x+2*s,by-9*s,3*s,'#58c15a');}
function palm(c,x,by,h){let tx=x;for(let i=0;i<h;i++){tx=x+Math.round(Math.sin(i/h*1.4)*2);R(c,tx,by-i,2,1,i%3?'#8a5a2b':'#6b4a2b');}const ty=by-h;
  for(const d of [-1,1]){for(let k=1;k<=8;k++){const fx=tx+d*k*2,fy=ty+Math.round(0.14*k*k-1.1*k);R(c,fx,fy,2,1,k<4?'#58c15a':'#2e8b3d');R(c,fx,fy+1,1,1,'#2e8b3d');}}
  R(c,tx,ty-4,1,4,'#58c15a');R(c,tx-1,ty-3,3,1,'#2e8b3d');disc(c,tx,ty+1,1,'#6b4a2b');}

function rock(c,x,by,s,col,dark,lite){col=col||'#8c96a3';dark=dark||'#59616d';lite=lite||'#b9c2cc';ell(c,x,by-s,s*2,s,col);R(c,x-s*2+1,by,s*4-1,1,dark);R(c,x-s,by-s*2,Math.max(2,s),1,lite);}

function zig(n,cx,amp,shrink,y0,y1,sx,ex){const p=[[sx,y0]];for(let i=1;i<=n;i++){const t=i/(n+1);p.push([cx+(i%2?-1:1)*amp*(1-t*shrink),y0+(y1-y0)*t]);}p.push([ex,y1]);return p;}

/* a route is a list of waypoints [x,y,type]; the optional type describes the stretch that ENDS at that point:
   w smooth walk (default) | l straight walk | u climb | d drop | b rope bridge | s stepping stones | t stairs | z zip-line | x boat */
function curve(P,T){
  const n=P.length,dense=[],dty=[];
  for(let i=0;i<n-1;i++){const ty=T?T[i+1]:'w';
    if(ty!=='w'){for(let s=0;s<24;s++){const t=s/24;dense.push([P[i][0]+(P[i+1][0]-P[i][0])*t,P[i][1]+(P[i+1][1]-P[i][1])*t]);dty.push(ty);}continue;}
    const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n-1,i+2)];
    for(let s=0;s<24;s++){const t=s/24,t2=t*t,t3=t2*t;const f=k=>0.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);dense.push([f(0),f(1)]);dty.push('w');}}
  dense.push(P[n-1]);dty.push(T?T[n-1]:'w');
  const cum=[0];for(let i=1;i<dense.length;i++)cum.push(cum[i-1]+Math.hypot(dense[i][0]-dense[i-1][0],dense[i][1]-dense[i-1][1]));
  const total=cum[cum.length-1];
  const find=d=>{let lo=0,hi=cum.length-1;while(lo<hi-1){const m=(lo+hi)>>1;if(cum[m]<=d)lo=m;else hi=m;}return[lo,hi];};

}

/* highest route point in every pixel column, ignoring stretches that float (bridges, zip-lines, stones) */
function groundOf(path,W,skip,pits){
  const g=new Array(W).fill(null),d=path.dense,t=path.dty;
  for(let i=0;i<d.length;i++){if(skip.indexOf(t[i])>=0)continue;const x=Math.max(0,Math.min(W-1,Math.round(d[i][0])));if(g[x]==null||d[i][1]<g[x])g[x]=d[i][1];}
  for(const k in pits){const rg=xRange(path,k);if(rg)for(let x=Math.max(0,rg[0]);x<=Math.min(W-1,rg[1]);x++)g[x]=pits[k];}
  let first=g.findIndex(v=>v!=null);if(first<0)return g.fill(0);
  for(let x=0;x<first;x++)g[x]=g[first];
  let last=first;for(let x=first+1;x<W;x++){if(g[x]==null)continue;if(x-last>1){for(let j=last+1;j<x;j++)g[j]=g[last]+(g[x]-g[last])*(j-last)/(x-last);}last=x;}

    for(let j=0;j<n;j++){const x=idx[j]%W,y=(idx[j]/W)|0;a[j]=fa(x,y);b[j]=fb(x,y);}return{n,idx,a,b};};

function prepLive(sc,id){
  const fx=MAPFX[id]||{},W=sc.W,H=sc.H,r=rng(MAPS[id].seed+5),rec=sc.rec||{clouds:[],birds:[]};
  const L={sc,W,H,fx,on:false,last:0,t0:0};
  const mk2=pixMask(sc,fx);L.water=mk2.water;L.lava=mk2.lava;
  if(L.water.n||L.lava.n){L.shCv=mk(W,H);L.shCtx=L.shCv.getContext('2d');L.shImg=L.shCtx.createImageData(W,H);L.sh32=new Uint32Array(L.shImg.data.buffer);}
  // clouds, birds
  const cl=rec.clouds.map(c=>[c[0],c[1],c[2]]).concat((fx.clouds||[]).map(c=>[c[0]*W,c[1]*H,c[2]]));
  L.clouds=cl.map((c,i)=>({x0:c[0],y:c[1],s:c[2],sp:2.2+c[2]*1.1+(i%3)*.9}));
  L.birds=rec.birds.map((b,i)=>({x0:b[0],y:b[1],col:b[2],sp:7+(i%3)*2.5,ph:i*1.9}));
  // twinkling stars, only on sky pixels
  L.tw=[];if(fx.twinkle){for(let n=0,tries=0;n<fx.twinkle.n&&tries<400;tries++){const x=2+Math.floor(r()*(W-4)),y=2+Math.floor(r()*(H*fx.twinkle.maxY-4));if(mk2.sky[y*W+x]){L.tw.push({x,y,ph:r()*6.3});n++;}}}
  L.aurora=!!fx.aurora;
  // sky layer (clouds, aurora, stars) is clipped to the sky pixels so mountains and emblems stay in front
  if(L.clouds.length||L.tw.length||L.aurora){
    L.skCv=mk(W,H);L.skCtx=L.skCv.getContext('2d');L.skCtx.imageSmoothingEnabled=false;
    const mc=mk(W,H),mctx=mc.getContext('2d'),im=mctx.createImageData(W,H),m32=new Uint32Array(im.data.buffer);
    for(let p=0;p<W*H;p++)if(mk2.sky[p])m32[p]=0xffffffff;
    mctx.putImageData(im,0,0);L.maskCv=mc;
  }
  // flag cloth
  if(MAPS[id].goal==='flag'){const g=sc.path.lv[100];L.flag={x:Math.round(g[0]),y:Math.round(g[1]),h:[]};for(let dx=0;dx<11;dx++){let h=0;for(let i=0;i<7;i++)if(Math.round(11-i*1.5)>dx)h=i+1;L.flag.h.push(h);}}
  // particles
  L.parts=[];
  const pk=MAPS[id].layout==='h'?Math.max(1,W*H/(MW*MH)*.5):1;
  for(const [kind,n,cols] of (fx.parts||[]))for(let i=0,nn=Math.round(n*pk);i<nn;i++)L.parts.push(mkPart(kind,cols,W,H,r,true));
  L.shoot=fx.shoot?{x:0,y:0,age:9,next:3+r()*3}:null;
  L.rr=r;
  return L;
}
function mkPart(kind,cols,W,H,r,first){
  const p={k:kind,x:r()*W,y:r()*H,ph:r()*6.3,col:cols?cols[Math.floor(r()*cols.length)]:'#fff',a:0,b:0,life:0,max:1};
  if(kind==='snow'){p.vy=9+r()*12;p.sz=r()<.25?2:1;}
  else if(kind==='ember'){embReset(p,W,H,r);if(first)p.life=r()*p.max;}
  else if(kind==='petal'||kind==='leaf'){p.vx=6+r()*8;p.vy=kind==='leaf'?(7+r()*6):(2+r()*4);p.y=H*.1+r()*H*.8;}
  else if(kind==='sand'){p.y=H*.42+r()*H*.56;p.len=3+Math.floor(r()*4);p.v=38+r()*34;}
  else if(kind==='firefly'){p.y=H*.25+r()*H*.7;p.tx=p.x;p.ty=p.y;}
  return p;
}
function embReset(p,W,H,r){p.x=W/2+(r()-.5)*28;p.y=H*.125+r()*4;p.vx=-3+r()*12;p.vy=-(14+r()*24);p.life=0;p.max=1.6+r()*1.8;}

function frameLive(t,dt){
  const L=LV;if(!L)return;const c=L.ctx,W=L.W,H=L.H,wind=5+11*gust(t),r=L.rr;
  c.clearRect(0,0,W,H);
  // water and lava shimmer
  if(L.shCv){
    const u=L.sh32;u.fill(0);
    let w=L.water;for(let i=0;i<w.n;i++){const v=Math.sin(w.a[i]-t*1.7)+Math.sin(w.b[i]+t*.8);if(v>1.38)u[w.idx[i]]=WATER_HI;else if(v<-1.5)u[w.idx[i]]=WATER_DN;}
    w=L.lava;for(let i=0;i<w.n;i++){const v=Math.sin(w.a[i]-t*3.4)+Math.sin(w.b[i]+t*1.3);if(v>.95)u[w.idx[i]]=LAVA_HI;else if(v<-1.1)u[w.idx[i]]=LAVA_DN;}
    L.shCtx.putImageData(L.shImg,0,0);c.drawImage(L.shCv,0,0);
  }
  // sky layer
  if(L.skCv){
    const s=L.skCtx;s.clearRect(0,0,W,H);
    if(L.aurora){s.globalAlpha=.22;for(let x=0;x<W;x++){const y=Math.round(H*.12+Math.sin(x*.045+t*.55)*9+Math.sin(x*.11-t*.8)*3);s.fillStyle='#6cf0c2';s.fillRect(x,y,1,12);s.fillStyle='#b58cff';s.fillRect(x,y+12,1,6);}s.globalAlpha=1;}
    for(const w of L.tw){const v=Math.sin(t*2.3+w.ph);if(v>.45)plus(s,w.x,w.y,'#ffffff');else if(v>-.25)R(s,w.x,w.y,1,1,'#ffffff');}
    for(const k of L.clouds){const x=((k.x0+t*k.sp+40*k.s)%(W+70*k.s))-35*k.s;cloud(s,Math.round(x),Math.round(k.y),k.s);}
    s.globalCompositeOperation='destination-in';s.drawImage(L.maskCv,0,0);s.globalCompositeOperation='source-over';
    c.drawImage(L.skCv,0,0);
  }
  // props swaying in the wind
  const g=gust(t);
  for(const s of L.sc.sprites){
    const sw=Math.sin(t*1.7+s.ph)*.9+g*1.3+(g>.4?Math.sin(t*5+s.ph)*.4:0),o1=Math.round(sw),o2=Math.round(sw*.5),h=s.h,a=Math.max(1,Math.floor(h*.34)),b=Math.max(a,Math.floor(h*.68));
    if(h<4){c.drawImage(s.cv,s.x+o2,s.y);continue;}
    c.drawImage(s.cv,0,0,s.w,a,s.x+o1,s.y,s.w,a);
    if(b>a)c.drawImage(s.cv,0,a,s.w,b-a,s.x+o2,s.y+a,s.w,b-a);
    c.drawImage(s.cv,0,b,s.w,h-b,s.x,s.y+b,s.w,h-b);
  }
  // flag cloth
  if(L.flag){const f=L.flag;for(let dx=0;dx<11;dx++){const wob=Math.round(Math.sin(t*6.5-dx*.8)*(.35+dx/11*(.7+g*1.1)));
    for(let i=0;i<f.h[dx];i++)R(c,f.x+1+dx,f.y-22+i+wob,1,1,i<2?'#ff7a6a':'#e24a3b');}}
  // birds
  for(const b of L.birds){const x=((b.x0+t*b.sp)%(W+40))-20,y=b.y+Math.sin(t*.9+b.ph)*3,fr=(Math.floor(t*4+b.ph)%2)?BIRD_A:BIRD_B;c.fillStyle=b.col;for(const q of fr)c.fillRect(Math.round(x)+q[0],Math.round(y)+q[1],1,1);}
  // particles
  for(const p of L.parts){
    if(p.k==='snow'){p.y+=p.vy*dt;p.x+=(wind*.55+Math.sin(t*1.3+p.ph)*5)*dt;if(p.y>H+2){p.y=-2;p.x=r()*W;}if(p.x>W+2)p.x=-2;c.globalAlpha=.9;c.fillStyle='#ffffff';c.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);c.globalAlpha=1;}
    else if(p.k==='ember'){p.life+=dt;if(p.life>p.max)embReset(p,W,H,r);p.x+=(p.vx+wind*.5)*dt;p.y+=p.vy*dt;const u=p.life/p.max;c.globalAlpha=1-u*u;c.fillStyle=u<.35?'#ffe27a':u<.7?'#ff9a2e':'#e2461f';c.fillRect(Math.round(p.x),Math.round(p.y),u<.5?2:1,u<.5?2:1);c.globalAlpha=1;}
    else if(p.k==='petal'||p.k==='leaf'){p.x+=(p.vx+wind)*dt;p.y+=p.vy*dt+Math.sin(t*2+p.ph)*.18;if(p.x>W+4){p.x=-4;p.y=H*.1+r()*H*.8;}if(p.y>H)p.y=H*.1;c.fillStyle=p.col;const f=Math.floor(t*3+p.ph)%2,x=Math.round(p.x),y=Math.round(p.y);c.fillRect(x,y,2,1);c.fillRect(x+f,y+1,1,1);}
    else if(p.k==='sand'){p.x+=(p.v+wind*2)*dt;if(p.x>W+8){p.x=-8;p.y=H*.42+r()*H*.56;}c.globalAlpha=.55;c.fillStyle='#fff2c4';c.fillRect(Math.round(p.x),Math.round(p.y),p.len,1);c.globalAlpha=1;}
    else if(p.k==='firefly'){
      if(Math.abs(p.tx-p.x)+Math.abs(p.ty-p.y)<2){p.tx=clamp(p.x+(r()-.5)*50,4,W-4);p.ty=clamp(p.y+(r()-.5)*40,H*.2,H*.97);}
      p.x+=(p.tx-p.x)*Math.min(1,dt*.8)+Math.sign(p.tx-p.x)*dt*3;p.y+=(p.ty-p.y)*Math.min(1,dt*.8)+Math.sign(p.ty-p.y)*dt*3;
      const gl=.5+.5*Math.sin(t*2.2+p.ph);if(gl>.3){const x=Math.round(p.x),y=Math.round(p.y);c.globalAlpha=.25*gl;c.fillStyle='#fff3b0';c.fillRect(x-1,y-1,3,3);c.globalAlpha=1;c.fillStyle='#fff9d0';c.fillRect(x,y,1,1);}}
  }
  // shooting star
  if(L.shoot){const s=L.shoot;s.age+=dt;
    if(s.age>s.next){s.age=0;s.next=4+r()*5;s.x=r()*W*.8;s.y=r()*H*.4;}
    if(s.age<.7){const u=s.age/.7,x=s.x+u*70,y=s.y+u*34;for(let i=0;i<9;i++){c.globalAlpha=(1-i/9)*(1-u*.4);c.fillStyle='#ffffff';c.fillRect(Math.round(x-i*2.2),Math.round(y-i*1.05),i<3?2:1,1);}c.globalAlpha=1;}}
}

const hasBadge=(k,id)=>!!(k.badges&&k.badges[id]);
function streakPosToday(k){let n=0;for(let i=0;i<60;i++){if(dayRec(k,dayAgo(i))[0]>0)n++;else break;}return n;}
/* progress shown on the badge sheet */
function badgeProg(k,id){
  const cnt=(k.cnt&&k.cnt.pos)||0;
  if(id==='star1')return{cur:Math.min(cnt,20),max:20};
  if(id==='star2')return{cur:Math.min(streakPosToday(k),5),max:5};
  if(id==='week'){let clean=0;for(let i=0;i<7;i++){if(dayRec(k,dayAgo(i))[1]>0)break;clean++;}return{cur:clean,max:7};}
  if(id==='climb')return{cur:Math.min(lvl(k.pts),50),max:50};
  if(id==='crown')return{cur:Math.min(dayRec(k,dayOf(Date.now()))[2],15),max:15};
  if(id==='trophy')return{cur:isDone(k)||k.certs.length?1:0,max:1};
  return{cur:0,max:1};
}
/* checked after every award; returns the ids earned just now */
function evalBadges(k){
  const got=[],ok=(id,cond)=>{if(cond&&!hasBadge(k,id)){k.badges=Object.assign({},k.badges);k.badges[id]=Date.now();got.push(id);}};
  const t=dayOf(Date.now());let neg=0,posDays=0;for(let i=0;i<7;i++){const r=dayRec(k,dayAgo(i));neg+=r[1];if(r[0]>0)posDays++;}
  ok('week',neg===0&&posDays>=3);
  ok('star1',((k.cnt&&k.cnt.pos)||0)>=20);
  ok('star2',streakPosToday(k)>=5);
  ok('climb',lvl(k.pts)>=50||tierOf(k)>=50);
  ok('crown',dayRec(k,t)[2]>=15);
  ok('trophy',k.certs.length>0);
  return got;
}
/* record an award in the counters (sign = +1 for a new entry, -1 for undo) */
function tally(k,e,sign){
  const d=dayOf(e.ts);k.days=Object.assign({},k.days);const r=(k.days[d]||[0,0,0]).slice();
  if(e.k==='pos'){r[0]=Math.max(0,r[0]+sign);r[2]=Math.max(0,r[2]+sign*Math.abs(e.p));k.cnt=Object.assign({pos:0,neg:0},k.cnt);k.cnt.pos=Math.max(0,k.cnt.pos+sign);}
  else{r[1]=Math.max(0,r[1]+sign);k.cnt=Object.assign({pos:0,neg:0},k.cnt);k.cnt.neg=Math.max(0,k.cnt.neg+sign);}
  k.days[d]=r;
  const keys=Object.keys(k.days).sort();while(keys.length>60)delete k.days[keys.shift()];
}

/* ---------- how the characters move and feel ----------
   A good behaviour makes the child run (or climb) happily. On the mountain-style maps a bad behaviour makes
   him tumble down and lie there; on the sideways maps he walks back with his head down.
   After any bad behaviour he stays sad (frown, tear, lowered head) until the next good one makes him smile at once. */
const mv={};
const isSad=k=>!!k.sad&&!isDone(k)&&k.pts<goal();
/* a pose is a short code: l1/l2 = which foot is lifted, s = sad face, d1/d2 = head lowered by 1 or 2 pixels */
function poseCv(cv,fx){
  const l=+((/l(\d)/.exec(fx)||[])[1]||0),sad=/s/.test(fx),dn=+((/d(\d)/.exec(fx)||[])[1]||0),sc=cv.getContext('2d');
  if(sad){
    const px=(x,y)=>sc.getImageData(x,y,1,1).data,eye=px(6,6),mo=px(7,9);
    if(mo[3]>200&&mo[0]>150&&mo[1]<120){const mc='rgb('+mo[0]+','+mo[1]+','+mo[2]+')';R(sc,6,10,1,1,mc);R(sc,9,10,1,1,mc);}
    if(eye[3]>200&&eye[0]<70&&eye[1]<70){R(sc,5,8,1,1,'#8fd8ff');R(sc,10,8,1,1,'#8fd8ff');R(sc,5,9,1,1,'#d7f2ff');R(sc,10,9,1,1,'#d7f2ff');}
  }
  if(!l&&!dn)return cv;
  const out=mk(CH_W,CH_H),c=out.getContext('2d');c.drawImage(cv,0,0);
  if(l){const x0=l===1?3:8,w=l===1?5:5;c.clearRect(x0,18,w,4);c.drawImage(cv,x0,18,w,4,x0,16,w,4);}
  if(dn){c.clearRect(0,0,CH_W,11);c.drawImage(cv,0,0,CH_W,11,0,dn,CH_W,11);}
  return out;
}
function poseFx(k,mo){
  const sad=isSad(k)||(mo&&mo.sad);let s='';
  if(mo&&mo.leg)s+='l'+mo.leg;
  if(sad)s+='s'+'d'+((mo&&mo.down)||1);
  return s;
}
const easeIO=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const mvDone=id=>{delete mv[id];bobbing[id]=false;placeActors();};
/* the picture and transform used for a character this frame (called from placeActors) */
function applyMove(k,el,img,upBase){
  const mo=mv[k.id];el.classList.toggle('idle',!mo);
  const fx=poseFx(k,mo),up=mo&&mo.up!=null?mo.up:upBase,want=avatarURL(effAv(k),up,fx);
  if(img.getAttribute('src')!==want)img.src=want;
  const tf=mo?'translateY('+(mo.ty||0)+'%) scaleX('+(mo.dir<0?-1:1)+') rotate('+(mo.rot||0)+'deg)':'';
  if(img.style.transform!==tf)img.style.transform=tf;
  const og=mo&&(mo.m==='fall'||mo.m==='lie'||mo.m==='rise')?'50% 55%':'50% 92%';
  if(img.style.transformOrigin!==og)img.style.transformOrigin=og;
  return mo?(mo.hop||0):null;
}
function xAt(k,l){return kidPos(k,l)[0];}
/* the whole trip of one character from level a to level b */
function moveKid(id,from,to,tok){
  const k=kidById(id),hz=!!curGeo.hz,neg=to<from,dist=Math.abs(to-from),t0=performance.now();
  const x0=xAt(k,from),x1=xAt(k,to);let dir=(x1-x0)>=0?1:-1,px=x0;
  const alive=()=>animTok[id]===tok;
  const track=(l)=>{const x=xAt(k,l);if(Math.abs(x-px)>.05)dir=x>px?1:-1;px=x;};
  if(!neg){
    const dur=clamp(dist*55,500,1800);bobbing[id]=true;
    const mo=mv[id]={m:'run',dir,hop:0,rot:0,leg:1,up:null,sad:false};
    (function step(now){if(!alive())return;const ms=now-t0,u=clamp(ms/dur,0,1),l=from+(to-from)*easeIO(u);disp[id]=l;track(l);
      const ph=Math.floor(ms/115)%2;mo.dir=dir;mo.leg=ph+1;
      if(hz){const h=Math.abs(Math.sin(ms/105));mo.hop=h*9;mo.rot=7;mo.up=h>.72;}
      else{mo.hop=Math.abs(Math.sin(ms/115))*3;mo.rot=ph?-4:4;mo.up=!!ph;}
      placeActors();camFollow(id);
      if(u<1)requestAnimationFrame(step);else{disp[id]=to;mvDone(id);}})(t0);
    return;
  }
  if(hz){
    const dur=clamp(dist*85,800,2400);bobbing[id]=true;
    const mo=mv[id]={m:'back',dir,hop:0,rot:5,leg:1,up:false,sad:true,down:2};
    (function step(now){if(!alive())return;const ms=now-t0,u=clamp(ms/dur,0,1),l=from+(to-from)*easeIO(u);disp[id]=l;track(l);
      mo.dir=dir;mo.leg=Math.floor(ms/190)%2+1;mo.hop=Math.abs(Math.sin(ms/190))*1.5;
      placeActors();camFollow(id);
      if(u<1)requestAnimationFrame(step);else{disp[id]=to;mvDone(id);}})(t0);
    return;
  }
  /* mountain maps: he loses his footing, tumbles down the path, lies there, then gets up sadly */
  const dur=clamp(dist*75,800,2100),spins=Math.max(1,Math.round(1+dist/10)),sp=(x1<x0?-1:1)*(Math.random()<.5?1:-1);
  bobbing[id]=true;tone(SND.neg);
  const mo=mv[id]={m:'fall',dir:1,hop:0,rot:0,leg:0,up:true,sad:true,down:1,ty:0};
  (function step(now){if(!alive())return;const ms=now-t0,u=clamp(ms/dur,0,1),e=Math.pow(u,1.5),l=from+(to-from)*e;disp[id]=l;
    mo.rot=sp*spins*360*u;mo.hop=Math.abs(Math.sin(u*Math.PI*(2+dist/9)))*14*(1-u*.55);mo.up=Math.floor(ms/110)%2===0;mo.leg=Math.floor(ms/110)%2+1;
    placeActors();camFollow(id);
    if(u<1)requestAnimationFrame(step);
    else{disp[id]=to;mo.rot=sp*90;mo.hop=0;mo.up=false;mo.leg=0;mo.m='lie';mo.ty=13.6;placeActors();burstAtKid(id,10);
      setTimeout(()=>{if(!alive())return;const r0=performance.now();
        (function rise(n){if(!alive())return;const v=clamp((n-r0)/520,0,1),e2=easeIO(v);mo.m='rise';mo.rot=sp*90*(1-e2);mo.ty=13.6*(1-e2);mo.leg=0;placeActors();
          if(v<1)requestAnimationFrame(rise);else mvDone(id);})(r0);},800);}})(t0);
}
/* a small hop of joy (good behaviour without a change of level) or a slump (bad behaviour without one) */
function reactKid(id,good){
  if(REDUCED||!$('#actors'))return;const tok=(animTok[id]=(animTok[id]||0)+1),t0=performance.now(),D=good?650:700,k=kidById(id);if(!k)return;
  const mo=mv[id]={m:good?'cheer':'slump',dir:1,hop:0,rot:0,leg:0,up:!!good,sad:!good,down:good?0:2};
  (function step(now){if(animTok[id]!==tok)return;const ms=now-t0,u=clamp(ms/D,0,1);
    if(good){mo.hop=Math.abs(Math.sin(u*Math.PI*3))*10;mo.up=true;}else{mo.rot=Math.sin(u*Math.PI*4)*6*(1-u);mo.hop=0;}
    placeActors();if(u<1)requestAnimationFrame(step);else mvDone(id);})(t0);
}

/* ---------- ambient sound for every map (all synthesised with Web Audio, no files) ----------
   One soundscape per map, played quietly while the adventure screen is open. The sound button mutes it with everything else.
   To remove the whole feature: delete this file from the build (nothing else depends on it). */
const AMB={run:null,master:null,an:null,gest:false,nb:{}};
const ambCtx=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;};
function ambMaster(){
  if(AMB.master)return AMB.master;const c=ambCtx();AMB.master=c.createGain();AMB.master.gain.value=.22*(typeof volBg==='function'?volBg():1);
  AMB.an=c.createAnalyser();AMB.an.fftSize=1024;AMB.master.connect(AMB.an);AMB.an.connect(c.destination);return AMB.master;
}
function ambNoise(kind){
  if(AMB.nb[kind])return AMB.nb[kind];const c=ambCtx(),n=c.sampleRate*3,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;if(kind==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5;}else d[i]=w;}
  return(AMB.nb[kind]=b);
}
const AMB_N=n=>{const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return 0;const s={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,((+m[3]+1)*12+s-69)/12);};

const AMB_TRIM={peak:1.9,desert:1.3,jungle:1.6,river:1.3,hop:1,bahrain:1.5};
function ambStart(id){
  const c=ambCtx(),run={id,dead:false,nodes:[],timers:[]},g=c.createGain();g.gain.value=0;g.connect(ambMaster());g.gain.linearRampToValueAtTime(AMB_TRIM[id]||1,c.currentTime+1.4);run.g=g;
  const keep=n=>{run.nodes.push(n);return n;};
  /* a looping noise layer: kind white|brown, filter {t,f,q}, level, optional slow LFO on level (rate,depth) or on the filter (frate,fdepth) */
  run.layer=(o)=>{const s=keep(c.createBufferSource());s.buffer=ambNoise(o.kind||'white');s.loop=true;s.loopStart=Math.random()*1.5;
    const f=c.createBiquadFilter();f.type=o.t||'lowpass';f.frequency.value=o.f||800;f.Q.value=o.q||.7;const v=c.createGain();v.gain.value=o.v||.05;

const ambWant=()=>{try{return soundOn()&&AMB.gest&&!document.hidden&&typeof view==='string'&&(view==='home'||Date.now()<(AMB.testUntil||0))&&!!MAPS[S.cfg.mapId];}catch(e){return false;}};

const AR_RX=/[؀-ۿ]/,EN_CACHE=new Map();
function trCore(c){
  if(EN_EX[c]!=null)return EN_EX[c];
  const d=c.replace(/[.،]$/,'');if(d!==c&&EN_EX[d]!=null)return EN_EX[d]+(c.endsWith('.')?'.':'');
  for(const [re,t] of EN_PAT){const m=re.exec(c);if(m)return t.replace(/\$(\d)/g,(_,i)=>trText(m[+i]));}
  const lt=/^([+\-−–✓✔★•→←\s]+)([\s\S]*)$/.exec(c);if(lt&&AR_RX.test(lt[2]))return lt[1]+trText(lt[2]);
  const tl=/^([\s\S]*?)(\s+[+\-−]\d+)$/.exec(c);if(tl&&AR_RX.test(tl[1]))return trText(tl[1])+tl[2];
  if(c.indexOf(' · ')>0)return c.split(' · ').map(trText).join(' · ');
  if(c.indexOf(' | ')>0)return c.split(' | ').map(trText).join(' | ');
  if(c.indexOf('، ')>0&&c.length<120)return c.split('، ').map(trText).join(', ');
  return c;
}
function trText(s){
  if(I18N.lang!=='en'||!s||typeof s!=='string'||!AR_RX.test(s))return s;
  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);let r=EN_CACHE.get(m[2]);
  if(r===undefined){r=trCore(m[2]);EN_CACHE.set(m[2],r);}
  return m[1]+r+m[3];
}
const TR=trText;
const TR_ATTR=['placeholder','aria-label','title','alt','value'];
function trNode(n){
  if(!n)return;
  if(n.nodeType===3){const v=n.nodeValue;if(AR_RX.test(v)){const t=trText(v);if(t!==v)n.nodeValue=t;}return;}
  if(n.nodeType!==1)return;
  if(n.hasAttribute&&n.hasAttribute('data-nt'))return;
  const tn=n.tagName;if(tn==='SCRIPT'||tn==='STYLE')return;
  for(const a of TR_ATTR){if(n.hasAttribute(a)){const v=n.getAttribute(a);if(AR_RX.test(v)){const t=trText(v);if(t!==v)n.setAttribute(a,t);}}}
  for(let c=n.firstChild;c;c=c.nextSibling)trNode(c);
}
function i18nStart(){
  if(I18N.lang!=='en')return;
  const de=document.documentElement;de.lang='en';de.dir='ltr';
  document.title='Kafo Alaik';
  trNode(document.body);
  new MutationObserver(recs=>{for(const r of recs){
    if(r.type==='childList')r.addedNodes.forEach(trNode);
    else if(r.type==='characterData')trNode(r.target);
    else if(r.type==='attributes'){const el=r.target,v=el.getAttribute(r.attributeName);if(v&&AR_RX.test(v)){const t=trText(v);if(t!==v)el.setAttribute(r.attributeName,t);}}
  }}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTR});
}

const famSubs={};let subs=[];
function unsubAll(){subs.forEach(u=>{try{u();}catch(e){}});subs=[];Object.keys(famSubs).forEach(k=>{try{famSubs[k]();}catch(e){}delete famSubs[k];});}
function subscribe(){
  unsubAll();if(!db)return;const er=e=>console.warn('sync',e);
  try{
    subs.push(db.doc('app/config').onSnapshot(s=>{if(pendingWrites){needResync=true;return;}if(s.metadata.hasPendingWrites||!s.exists)return;applyCfg(J(s.data()));},er));
    subs.push(db.collection('kids').onSnapshot(s=>{if(pendingWrites){needResync=true;return;}if(s.metadata.hasPendingWrites)return;applyKids('',s.docs);},er));
    subs.push(db.collection('fam').onSnapshot(s=>{if(pendingWrites){needResync=true;return;}if(s.metadata.hasPendingWrites)return;applyFams(s.docs);},er));
  }catch(e){er(e);}
  Object.keys(S.fams).forEach(subFam);
}
function subFam(uid){if(famSubs[uid]||!db)return;famSubs[uid]=db.doc('fam/'+uid).collection('kids').onSnapshot(s=>{if(pendingWrites){needResync=true;return;}if(s.metadata.hasPendingWrites)return;applyKids(uid,s.docs);},e=>console.warn('sync',e));}
async function resync(){
  if(!db)return;try{
    const cs=await db.doc('app/config').get();if(cs.exists)applyCfg(J(cs.data()));
    const fs=await db.collection('fam').get();applyFams(fs.docs);
    applyKids('',(await db.collection('kids').get()).docs);
    for(const uid of Object.keys(S.fams))applyKids(uid,(await db.doc('fam/'+uid).collection('kids').get()).docs);
  }catch(e){console.warn(e);}
}
function applyCfg(o){
  const n=Object.assign(DEF_CFG(),o);n.rewards=Object.assign({25:'',50:'',75:'',100:''},n.rewards||{});
  if(JSON.stringify(n)===JSON.stringify(S.cfg))return;
  const big=n.mapId!==S.cfg.mapId||n.round!==S.cfg.round||n.goal!==S.cfg.goal;S.cfg=n;syncUI(big);
}
function applyFams(docs){
  const seen=new Set();let changed=false;
  docs.forEach(d=>{seen.add(d.id);const n=normFam(d.id,J(d.data()));if(JSON.stringify(n)!==JSON.stringify(S.fams[d.id])){S.fams[d.id]=n;changed=true;}subFam(d.id);});
  Object.keys(S.fams).forEach(uid=>{if(!seen.has(uid)){delete S.fams[uid];if(famSubs[uid]){try{famSubs[uid]();}catch(e){}delete famSubs[uid];}S.kids=S.kids.filter(k=>k.fam!==uid);changed=true;}});
  if(changed){sortKids();syncUI(true);}
}
function applyKids(fam,docs){
  const inc=new Map(docs.map(d=>[d.id,normKid(Object.assign(J(d.data()),{id:d.id,fam}))]));let structural=false;const moved=[];let meta=false;
  S.kids=S.kids.filter(k=>{if(k.fam!==fam||inc.has(k.id))return true;structural=true;return false;});
  inc.forEach((nk,id)=>{const ok=S.kids.find(k=>k.id===id&&k.fam===fam);
    if(!ok){S.kids.push(nk);structural=true;return;}
    if(JSON.stringify(ok)===JSON.stringify(nk))return;
    const dp=nk.pts-ok.pts;Object.keys(ok).forEach(x=>delete ok[x]);Object.assign(ok,nk);if(dp)moved.push({k:ok,dp});else meta=true;});
  if(structural){sortKids();syncUI(true);return;}
  if(moved.length||meta)syncUI(false,moved);
}

  else if(a==='pick'){const i=Math.max(0,(S.kids||[]).findIndex(k=>k.id===el.dataset.id));s=[[500+i*70,.04,'sine'],[750+i*70,.07,'sine']];}

  else if(a==='wdpick'||a==='wdhero'||a==='wdtab'||a==='av'||a==='avg'){const v=parseInt(el.dataset.v,10);s=[[700+((isNaN(v)?0:v)%9)*55,.03,'triangle'],[1000+((isNaN(v)?0:v)%9)*40,.04,'triangle']];}

function forkCross(k,f,pts,pay){
  const m=mapOf();if(!m.fork||!f||f.st!=='alt'||lvl(pts)<m.fork.b)return null;
  f.st='done';let bonus=0,msg=k.name+' عبر الجسر بسلام!';
  if(!f.danger&&!f.used){f.used=true;if(pay){bonus=Math.min(Math.round(goal()*.10),goal()-pts);if(bonus>0)msg=k.name+': الجسر كان آمنًا! اختصر الطريق وكسب '+bonus+' نقاط.';}}
  return{bonus,msg};
}

/* ---------- award points ---------- */
function give(kidId,bid,type){
  const k=kidById(kidId);if(!k||!canCtl(k))return;const bh=behFor(k),list=type==='neg'?bh.neg:bh.pos,b=list.find(x=>x.id===bid);if(!b)return;
  if(!canAward()||isDone(k))return;
  if(needsFork(k)){closePop();openFork(k.id);return;}
  const from=k.pts;let to=clamp(from+(type==='neg'?-b.p:b.p),0,goal());
  if(to===from){if(type==='neg')toast('ما عنده نقاط لتُخصم');return;}
  const m=mapOf(),oldL=lvl(from),oldTier=tierOf(k),fk0=m.fork&&forkOf(k)?JSON.parse(JSON.stringify(forkOf(k))):null;
  // the fork: negatives on a dangerous bridge, crossing, falling back, arriving
  let bonus=0,thrown=false,asked=false,forkMsg='';
  if(m.fork){const A=m.fork.a,B=m.fork.b,f=fk0?Object.assign({},fk0):{tk:tierKey(),st:'',danger:false,negs:0,used:false};f.tk=tierKey();
    if(type==='neg'&&f.st==='alt'&&oldL<B){f.negs=(f.negs||0)+1;if(f.danger&&f.negs>=FORK_NEGS){f.st='thrown';thrown=true;}}
    const cr=forkCross(k,f,to,true);if(cr){bonus=cr.bonus;forkMsg=cr.msg;}
    const nl=lvl(to+bonus);
    if(nl<A){f.st='';f.negs=0;thrown=false;}
    else if(f.st===''||f.st==='ask'){f.st='ask';asked=true;}
    if(thrown)forkMsg=k.name+': انفجر البركان وقذفه إلى الطريق الطويل!';
    k.fork=f;}
  to+=bonus;k.pts=to;
  const newL=lvl(to),delta=to-from,newTier=Math.max(oldTier,milestone(newL));k.tier=newTier;k.tk=tierKey();
  const ent={id:uid(),t:b.t,p:delta-bonus,k:type,from,to,ts:Date.now()};if(m.fork){ent.fk=fk0;if(bonus)ent.bonus=bonus;}
  k.log.unshift(ent);if(k.log.length>40)k.log.length=40;tally(k,ent,1);
  const chests=[25,50,75].filter(x=>oldL<x&&newL>=x&&rewardOf(x));chests.forEach(x=>{chestHold[x]=true;});
  let finished=false;
  if(to>=goal()){k.tier=100;k.certs.push({id:uid(),ts:Date.now(),mapId:S.cfg.mapId,round:curRound(),pts:to,goal:goal(),name:k.name,period:S.cfg.period||null});finished=true;}
  k.sad=type==='neg'&&!finished;
  const gotB=evalBadges(k);const gotH=evalHeroes(k);
  persistKid(k);closePop();
  if(view==='home'){
    if(thrown)throwKid(k.id,dispTarget(k));else if(Math.abs(dispTarget(k)-(disp[k.id]==null?0:disp[k.id]))<0.01)reactKid(k.id,type!=='neg');else animateKid(k.id,dispTarget(k));
    floatText(k.id,(delta-bonus>0?'+':'')+(delta-bonus),delta-bonus>0?'p':'n');
    if(bonus)setTimeout(()=>floatText(k.id,'+'+bonus+' اختصار','p'),900);
    refreshHome();}
  let wait=REDUCED?100:Math.min(1900,Math.abs(newL-oldL)*55+700)+(thrown?900:0);
  let mileHit=0;for(const m2 of [25,50,75])if(oldL<m2&&newL>=m2)mileHit=m2;
  const badgeLater=()=>{if(gotB.length)setTimeout(()=>{if(!sheetOpen)openBadgeWin(k.id,gotB);},REDUCED?100:600+(thrown?1600:0));};
  if(forkMsg)setTimeout(()=>toast(forkMsg),thrown?600:wait*.6);
  const tail=()=>{
  if(finished){tone(SND.win);setTimeout(()=>{closeSheet();openFinish(k.id);},wait);if(gotB.length)toast(k.name+' حصل على شارة: '+gotB.map(i=>BADGES.find(x=>x.id===i).n).join('، '));}
  else if(newTier>oldTier&&newTier<100){tone(SND.mile);setTimeout(()=>{if(view==='home'&&!sheetOpen)openUnlock(k.id,newTier);},wait+200);setTimeout(()=>burstAtKid(k.id,46),400);if(gotB.length)toast(k.name+' حصل على شارة: '+gotB.map(i=>BADGES.find(x=>x.id===i).n).join('، '));}
  else if(mileHit){tone(SND.mile);toast(k.name+' وصل المحطة '+mileHit+'!');setTimeout(()=>burstAtKid(k.id,46),400);badgeLater();}
  else if(newL>oldL){tone(SND.lvl);setTimeout(()=>burstAtKid(k.id,18),350);setTimeout(()=>{badgeLater();},wait);}
  else{tone(delta<0?SND.neg:SND.pos);badgeLater();}
  };
  if(chests.length&&view==='home'){const w0=wait;setTimeout(()=>{if(view!=='home'){chests.forEach(x=>{chestHold[x]=false;});wait=100;tail();return;}wait=100;openChests(k.id,chests.slice(),()=>{chests.forEach(x=>{chestHold[x]=false;});renderChests();tail();});},w0+300);}else{chests.forEach(x=>{chestHold[x]=false;});tail();}
  if(gotH.length){const tryH=n=>setTimeout(()=>{if(!sheetOpen)openHeroWin(k.id,gotH);else if(n<4)tryH(n+1);},n?2500:wait+(gotB.length||finished||newTier>oldTier?3200:1200));tryH(0);}
  if(asked&&!finished&&view==='home')setTimeout(()=>{if(!sheetOpen&&needsFork(k))openFork(k.id);},wait+(newTier>oldTier?1400:350));
}
function undoLast(id){
  const k=kidById(id);if(!k||!canCtl(k)||!k.log.length)return;const e=k.log.shift();k.pts=e.from;tally(k,e,-1);k.sad=!!(k.log[0]&&k.log[0].k==='neg');
  if(k.pts<goal())k.certs=k.certs.filter(c=>c.round!==curRound());
  const m=mapOf();if(m.fork){k.fork=e.fk?JSON.parse(JSON.stringify(e.fk)):null;if(k.fork&&lvl(k.pts)<m.fork.a){k.fork.st='';k.fork.negs=0;}}
  persistKid(k);if(view==='home'){animateKid(k.id,dispTarget(k));refreshHome();}closePop();toast('تم التراجع');
}

function fmtCode(c){return c&&c.length>3?c.slice(0,3)+'-'+c.slice(3):(c||'');}
const normCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function genCode(){const al='ABCDEFGHJKMNPQRSTUVWXYZ23456789',a=new Uint8Array(6);(window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*256)}).getRandomValues(a);let s='';for(const v of a)s+=al[v%al.length];return s;}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return 'الآن';if(m<60)return 'قبل '+m+' د';const h=Math.round(m/60);if(h<24)return 'قبل '+h+' س';const d=Math.round(h/24);return d===1?'أمس':'قبل '+d+' أيام';}

async function joinFamily(){
  const code=normCode($('#jCode').value),name=$('#jName').value.trim(),n=clamp(Math.round(+$('#jN').value)||1,1,8);
  if(!code||!name){toast('اكتب الكود واسم العائلة');return;}
  try{
    const iv=await db.doc('app/inv').get(),codes=iv.exists?(iv.data().codes||{}):{};
    if(!codes[code]){toast('الكود غير صحيح، تأكد منه');return;}
    const fs=await db.collection('fam').get();
    if(fs.docs.some(d=>d.id!==me.uid&&d.data().code===code)){toast('هذا الكود استُخدم من عائلة ثانية');return;}
    const f=normFam(me.uid,{name,code,expected:n,ts:Date.now(),cfg:{pos:J(S.cfg.pos),neg:J(S.cfg.neg)}});
    await db.doc('fam/'+me.uid).set({name:f.name,code:f.code,expected:f.expected,ts:f.ts,cfg:J(f.cfg)});
    S.fams[me.uid]=f;subFam(me.uid);sortKids();toast('انضممتم للتحدي! الحين أضف أبناءك');go('kids');openKidEditor();
  }catch(e){console.warn(e);toast('تعذّر الانضمام. اطلب من الرئيس يعطيك صلاحية «مشارك» من قائمة المشاركة');}
}

const pwGet=()=>{try{return JSON.parse(localStorage.getItem('kafo.pw')||'null');}catch(e){return null;}};
const hasPw=()=>!!pwGet();
const pwOK=()=>!hasPw()||pwUntil>Date.now();
const pwActOK=()=>pwOK()||pwActUntil>Date.now();
async function pwHash(pw,salt){
  const data=new TextEncoder().encode(salt+':'+pw);
  if(window.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){}}
  let h=5381;for(const c of data)h=((h*33)^c)>>>0;return 'x'+h.toString(16);
}
async function pwSave(pw){const salt=genCode()+genCode();const h=await pwHash(pw,salt);try{localStorage.setItem('kafo.pw',JSON.stringify({s:salt,h}));return true;}catch(e){return false;}}
async function pwCheck(pw){const o=pwGet();if(!o)return true;return (await pwHash(pw,o.s))===o.h;}

   +secHtml('pts','نظام النقاط','اختصار لتبويب النقاط في الشريط',ptsSec())
   +(g?'':secHtml('round','الجولة','الخريطة والفترة والهدف والمكافآت وتصفير النقاط',roundBody()))
   +(g||db?'':secHtml('bk','نسخة احتياطية','حفظ نسخة من بيانات اللعبة أو استعادتها',backupPanel().replace(/<section class="panel" style="margin-top:14px">/,'<section>')))
   +secHtml('pw','كلمة السر',hasPw()?'مفعّلة · غيّرها أو أزلها':'غير مفعّلة · ضع كلمة تحمي الإعدادات',pwSec())
   +(g?'':secHtml('rst','الرجوع إلى الإعدادات الأصلية','حذف كل شيء وبدء اللعبة من جديد',resetSec()))
   +'</div>';
  if(SETOPEN.round)paintMaps();
}

/* ================= certificates ================= */
function renderCerts(){
  V.innerHTML='<div class="view"><div class="sec-head"><div><h2>الشهادات</h2><p class="sub">لكل ابن ملف خاص. اضغط «الشهادات» لترى عوالمه كلها، وكل عالم أنهاه تظهر شهادته مضيئة بالأصفر للعرض والحفظ.</p></div><button class="btn gold" data-act="prevcert">معاينة شهادة</button></div>'
   +(S.kids.length?'<div class="cgrid">'+S.kids.map(k=>{const n=new Set(k.certs.map(c=>c.mapId).filter(x=>MAPS[x])).size;
     return '<article class="kcard" style="grid-template-columns:60px minmax(0,1fr)"><div class="av">'+avHtml(k)+'</div><div class="grow"><div class="nm">'+esc(k.name)+'</div><div class="meta">'+(n?'شهادات '+n+' من '+MAP_LIST.length+' عوالم':'لا شهادات بعد')+'</div></div><div style="grid-column:1/-1"><button class="btn gold small" type="button" data-act="kcerts" data-id="'+k.id+'">الشهادات</button></div></article>';}).join('')+'</div>'
     :'<div class="panel empty"><div class="big">لا أبناء بعد</div><p class="sub">أضف ابنًا من صفحة «الأبناء»، وتظهر هنا شهاداته.</p></div>')+'</div>';
}
/* one child's file: every world as an icon; a world he finished glows yellow with its certificate, the others stay dim and empty */
function certsHtml(k){
  const by={};k.certs.forEach(c=>{if(MAPS[c.mapId])(by[c.mapId]=by[c.mapId]||[]).push(c);});
  const n=Object.keys(by).length;
  return '<div class="sheet-head"><div class="av">'+avHtml(k)+'</div><div class="grow"><h2>شهادات '+esc(k.name)+'</h2><div class="sub">'+(n?'أنهى '+n+' من '+MAP_LIST.length+' عوالم':'لم ينهِ أي عالم بعد')+'</div></div><button class="btn small" type="button" data-act="close">تم</button></div>'
   +'<div class="maps wt-grid">'+MAP_LIST.map(m=>{const cs=(by[m.id]||[]).slice().sort((a,b)=>a.ts-b.ts),on=cs.length>0;
     return '<div class="map-card wt '+(on?'on':'off')+'" aria-label="'+esc(m.name)+(on?'':'، لا توجد شهادة')+'"><canvas width="'+MW+'" height="'+MH+'" data-map="'+m.id+'" role="img" aria-label="'+esc(m.name)+'"></canvas><b>'+esc(m.name)+'</b>'
      +(on?(cs.length>1?'<small>'+cs.length+' شهادات</small>':'')+cs.map(c=>'<button class="btn gold small wtb" type="button" data-act="certshow" data-back="1" data-id="'+k.id+'" data-cid="'+c.id+'">عرض وحفظ الشهادة'+(cs.length>1?' · الجولة '+(c.round||1):'')+'</button>').join(''):'')+'</div>';}).join('')+'</div>';
}
function openKidCerts(id){
  const k=kidById(id);if(!k)return;openSheet(certsHtml(k),{});
  $$('#sheetHost canvas[data-map]').forEach((cv,i)=>setTimeout(()=>{if(cv.isConnected)cv.getContext('2d').drawImage(buildScene(cv.dataset.map).cv,0,0);},i*40));
}
async function showCert(o,title,back){
  openSheet('<h2>'+esc(title)+'</h2><p class="sub">جارٍ تجهيز الشهادة…</p>',{});
  try{const cv=await makeCert(o),blob=await new Promise(r=>cv.toBlob(r,'image/png')),url=URL.createObjectURL(blob);certBlob={blob,name:o.name||'بطل'};
    if(!sheetOpen)return;
    setSheet('<h2>'+esc(title)+'</h2><img class="certimg" src="'+url+'" alt="الشهادة"><div class="row" style="justify-content:center"><button class="btn primary" type="button" data-act="certsave">حفظ الصورة للطباعة</button>'+(back?'<button class="btn" type="button" data-act="kcerts" data-id="'+back+'">رجوع للعوالم</button>':'')+'<button class="btn" type="button" data-act="close">إغلاق</button></div><p class="sub" style="text-align:center">بمقاس A4، احفظ الصورة ثم اطبعها.</p>');
  }catch(e){console.warn(e);if(sheetOpen)setSheet('<h2>تعذّر إنشاء الشهادة</h2><p class="sub">حاول مرة ثانية.</p><button class="btn" type="button" data-act="close">إغلاق</button>');}
}
async function saveCert(){
  if(!certBlob)return;
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(!dl){toast('اضغط مطولًا على الصورة لحفظها');return;}await dl.save({filename:'شهادة كفو عليك - '+certBlob.name+'.png',data:certBlob.blob});toast('تم حفظ الشهادة');}
  catch(e){if(e&&e.code==='declined')return;toast('تعذّر الحفظ، اضغط مطولًا على الصورة لحفظها');}
}
function certOpts(k,ct){return{mapId:ct.mapId,name:ct.name||k.name,av:effAv(k,ct.mapId,100),photo:k.photo,goal:ct.goal||goal(),period:ct.period,ts:ct.ts};}

/* ---- backup (only when the data lives in this browser): save to a file, restore from a file ---- */
function backupPanel(){
  if(db)return'';
  return '<section class="panel" style="margin-top:14px"><h3>نسخة احتياطية</h3><p class="sub">بيانات الأبناء محفوظة داخل هذا الجهاز فقط. احفظ نسخة بين فترة وأخرى، أو استخدمها لنقل كل شي إلى جهاز ثاني.</p>'
   +'<div class="row"><button class="btn gold" type="button" data-act="bkexp">حفظ نسخة احتياطية</button><label class="btn" for="bkIn" tabindex="0">استعادة من نسخة</label><input id="bkIn" type="file" accept="application/json,.json" hidden></div></section>';
}
function exportBackup(){
  const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const blob=new Blob([JSON.stringify({app:'kafo',v:1,ts:Date.now(),cfg:S.cfg,kids:S.kids})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='كفو-عليك-نسخة-'+ds+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('تم حفظ النسخة الاحتياطية');
}
let pendingBk=null;
function readBackup(file){
  if(!file)return;const fr=new FileReader();
  fr.onload=()=>{let o=null;try{o=JSON.parse(String(fr.result));}catch(e){}
    if(!o||o.app!=='kafo'||!Array.isArray(o.kids)){toast('هذا الملف ما هو نسخة من «كفو عليك»');return;}
    pendingBk=o;openSheet('<div class="empty"><div class="big" style="font-size:34px;color:var(--brand)">استعادة النسخة؟</div><p style="margin-top:6px">فيها '+o.kids.length+' من الأبناء. بيانات هذا الجهاز الحالية تُستبدل بها.</p>'
      +'<div class="row" style="justify-content:center;margin-top:14px"><button class="btn gold" type="button" data-act="bkgo">نعم، استعد</button><button class="btn" type="button" data-act="close">إلغاء</button></div></div>',{});};
  fr.onerror=()=>toast('تعذّرت قراءة الملف');fr.readAsText(file);
}
function applyBackup(){
  const o=pendingBk;pendingBk=null;if(!o)return;
  S.cfg=Object.assign(DEF_CFG(),o.cfg||{});S.cfg.rewards=Object.assign({25:'',50:'',75:'',100:''},S.cfg.rewards||{});
  S.kids=o.kids.map(normKid);sortKids();persistLocal();closeSheet();go('home');toast('تمت استعادة النسخة');
}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='bkIn'){readBackup(e.target.files&&e.target.files[0]);e.target.value='';}});

/* ================= actions + events ================= */
const ACT={
  pick(el){selectKid(el.dataset.id);},
  pm(el){openPop(el.dataset.id,el.dataset.t);},
  popclose(){closePop();},
  hudtoggle(){hudOpen=!hudOpen;refreshHud();},
  camzoom(){camZoom=!camZoom;renderHome();toast(camZoom?'الخريطة كاملة على الشاشة':'الخريطة مكبّرة');},
  camtop(){const c=camEl();if(!c)return;if(curGeo.hz)c.scrollTo({left:c.scrollWidth,behavior:camSmooth()});else c.scrollTo({top:0,behavior:camSmooth()});},
  cambot(){const c=camEl();if(!c)return;if(curGeo.hz)c.scrollTo({left:0,behavior:camSmooth()});else c.scrollTo({top:c.scrollHeight,behavior:camSmooth()});},
  fork(el){openFork(el.dataset.id);},
  rwdel(el){const m=el.dataset.m,i=$('[data-rw="'+m+'"]');S.cfg.rewards[m]='';if(i){i.value='';i.focus();}persistCfg();toast(+m<100?'تم حذف المكافأة، ولن يظهر صندوق عند المحطة '+m:'تم حذف المكافأة');},
  bkexp(){exportBackup();},
  bkgo(){applyBackup();},
  forkgo(el){forkChoose(el.dataset.id,el.dataset.v);},
  wardrobe(el){closePop();openWardrobe(el.dataset.id,el.dataset.hero?'hero':null);},
  wdhero(el){wdHero(el.dataset.v);},
  wdtab(el){if(wd){wd.tab=el.dataset.v;setSheet(wardrobeHtml(kidById(wd.id)));}},
  wdpick(el){wdPick(el.dataset.k,+el.dataset.v);},
  wdlater(){closeSheet();},
  noop(){},
  scenebg(){if(sel){sel=null;renderSel();}},
  give(el){give(el.dataset.id,el.dataset.bid,el.dataset.t);},
  undo(el){undoLast(el.dataset.id);},
  close(){closeSheet();},
  addkid(){guardPw(()=>openKidEditor());},
  editkid(el){const id=el.dataset.id;guardPw(()=>openKidEditor(id));},
  tohome(){closeSheet();closePop&&closePop();const sp=$('#splash');sp.classList.remove('gone');drawSplash();},
  setlang(el){if(el.dataset.v!==I18N.lang)setLang(el.dataset.v);},
  ptsunlock(){guardPw(()=>render());},
  sndtoggle(){toggleSound();render();},
  sndtest(){if(!soundOn()){toast('الصوت مكتوم، شغّله أولًا');return;}tone(SND.pos);AMB.gest=true;AMB.testUntil=Date.now()+5000;ambSync();toast('تسمع الآن صوت خلفية الخريطة الحالية');},
  pwforgot(){closeSheet();forgotSheet();},
  wipego(){wipeAll();},
  pwoff(){try{localStorage.removeItem('kafo.pw');}catch(e){}pwUntil=0;pwActUntil=0;render();toast('أُزيلت كلمة السر');},
  delkid(){delKid();},
  photodel(){if(!draft)return;draft.photo=null;$('#photoPrev').innerHTML=photoPrevHtml();},
  avg(el){if(!draft)return;const g=el.dataset.v==='f'?'f':'m';if(draft.av.g!==g){draft.av.g=g;if(HEADS[draft.av.st].g!==g)draft.av.st=defHead(g);$('#builder').innerHTML=builderHtml();$('#photoPrev').innerHTML=photoPrevHtml();}},
  av(el){if(!draft)return;draft.av[el.dataset.k]=+el.dataset.v;$('#builder').innerHTML=builderHtml();$('#photoPrev').innerHTML=photoPrevHtml();},
  gobeh(){closeSheet();go('beh');},
  gotoround(){go('round');},
  sugg(el){const t=el.dataset.type,s=SUGG[t][+el.dataset.i];(t==='pos'?BH().pos:BH().neg).push({id:uid(),t:s[0],p:s[1]});persistBH();render();},
  bp(el){const l=el.dataset.type==='pos'?BH().pos:BH().neg,b=l.find(x=>x.id===el.dataset.id);if(!b)return;b.p=clamp(b.p+(+el.dataset.d),1,100);persistBH();render();},
  bdel(el){const t=el.dataset.type,h=BH();if(t==='pos')h.pos=h.pos.filter(x=>x.id!==el.dataset.id);else h.neg=h.neg.filter(x=>x.id!==el.dataset.id);persistBH();render();},
  pickmap(el){S.cfg.mapId=el.dataset.id;persistCfg();$$('.map-card').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===S.cfg.mapId)));toast('الخريطة الآن: '+mapOf().name+' — '+mapOf().feat);tone(SND.pos);},
  prevcert(){showCert({mapId:S.cfg.mapId,name:'اسم البطل',av:avatarFrom(2),photo:null,goal:goal(),period:S.cfg.period,ts:Date.now()},'معاينة الشهادة');},
  pclear(){S.cfg.period=null;persistCfg();render();toast('أُلغيت الفترة');},
  newround(){newRound();},
  cert(el){const k=kidById(el.dataset.id);if(!k)return;const ct=k.certs.slice().reverse().find(c=>c.round===curRound())||k.certs[k.certs.length-1];if(!ct)return;closeSheet();showCert(certOpts(k,ct),'شهادة '+k.name);},
  certshow(el){const k=kidById(el.dataset.id);if(!k)return;const ct=k.certs.find(c=>c.id===el.dataset.cid);if(!ct)return;showCert(certOpts(k,ct),'شهادة '+(ct.name||k.name),el.dataset.back?k.id:null);},
  kcerts(el){openKidCerts(el.dataset.id);},
  certsave(){saveCert();},
  badges(el){closePop();closeSheet();openBadges(el.dataset.id);},
  feed(){closePop();openFeed();},
  invite(){openInvite();},
  copycode(el){copyCode(el.dataset.id);},
  invdel(el){delete S.inv[el.dataset.id];persistInv();renderKids();toast('أُلغي الكود');},
  famdel(el){removeFamily(el.dataset.id);}
};
function arm(el){el.classList.add('armed');el.dataset.orig=el.textContent;el.textContent='اضغط للتأكيد';setTimeout(()=>{if(el.isConnected&&el.classList.contains('armed')){el.classList.remove('armed');el.textContent=el.dataset.orig;}},3000);}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-tab]');if(!el)return;
  if(el.dataset.tab){go(el.dataset.tab);return;}
  const a=el.dataset.act;
  if(a==='backdrop'){if(e.target===el)closeSheet();return;}
  if(el.hasAttribute('data-confirm')&&!el.classList.contains('armed')){arm(el);return;}
  if(ACT[a])ACT[a](el,e);
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='kidForm')saveKid();else if(f.id==='joinForm')joinFamily();else if(f.id==='invForm')createInvite();else if(f.id==='pwForm')doUnlock();else if(f.id==='pwSetForm')setPwFromForm();else if(f.dataset&&f.dataset.form==='beh')addBeh(f);});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='kPhoto'&&t.files&&t.files[0]&&draft){try{draft.photo=await resizePhoto(t.files[0]);$('#photoPrev').innerHTML=photoPrevHtml();}catch(err){toast('تعذّر قراءة الصورة');}t.value='';}
  else if(t.id==='pStart'||t.id==='pEnd'){const s=$('#pStart').value,en=$('#pEnd').value;if(s&&en&&en<s){toast('تاريخ النهاية قبل البداية، عدّله');return;}S.cfg.period=(s||en)?{start:s,end:en}:null;persistCfg();}
  else if(t.id==='goalIn'){S.cfg.goal=clamp(Math.round(+t.value)||100,10,5000);t.value=S.cfg.goal;persistCfg();toast('الهدف الآن '+S.cfg.goal+' نقطة');}
  else if(t.dataset&&t.dataset.rw){S.cfg.rewards[t.dataset.rw]=t.value.trim();persistCfg();}
});
async function setPwFromForm(){
  const a=$('#pwA').value,b=$('#pwB').value;
  if(a.length<4){toast('كلمة السر لازم تكون 4 أحرف أو أرقام على الأقل');return;}
  if(a!==b){toast('الكلمتان غير متطابقتين');return;}
  if(await pwSave(a)){pwUntil=Date.now()+3*3600e3;render();toast('تم حفظ كلمة السر');tone(SND.lvl);}else toast('تعذّر حفظ كلمة السر على هذا الجهاز');
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='volFx'){VOL.fx=clamp(+t.value|0,0,100);volSave();const n=$('#volFxN');if(n)n.textContent=VOL.fx;}
  else if(t.id==='volBg'){VOL.bg=clamp(+t.value|0,0,100);volSave();volApply();const n=$('#volBgN');if(n)n.textContent=VOL.bg;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='volFx'){tone(SND.pos);}
  else if(t.id==='volBg'){if(soundOn()&&VOL.bg>0){AMB.gest=true;AMB.testUntil=Date.now()+4500;ambSync();}}
  else if(t.id==='famIn'){const v=t.value.trim().slice(0,24);if(isGuest()){const f=myFam();if(f){f.name=v||'عائلة';persistFam(f);}}else{S.cfg.famName=v;persistCfg();}toast('تم حفظ اسم العائلة');const sb=$('#view .sub');if(sb&&view==='settings')sb.textContent=famName(isGuest()?me.uid:'');}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('set')){SETOPEN[d.dataset.sec]=d.open;if(d.open&&d.dataset.sec==='round')paintMaps();}},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(sheetOpen)closeSheet();else if(popCtx)closePop();else if(sel){sel=null;renderSel();}}
  else if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('actor')){e.preventDefault();selectKid(e.target.dataset.id);}
});
$('#soundBtn').addEventListener('click',()=>{toggleSound();if(view==='settings'&&pwOK())render();});
function updateSound(){const b=$('#soundBtn');b.setAttribute('aria-pressed',String(soundOn()));b.setAttribute('aria-label',soundOn()?'إيقاف الصوت':'تشغيل الصوت');b.firstElementChild.className='ico '+(soundOn()?'i-sound':'i-mute');}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&db&&ready&&!pendingWrites&&$('#splash').classList.contains('gone'))resync();});
let rzT,wasWide=innerWidth>=760;window.addEventListener('resize',()=>{const w=innerWidth>=760;if(w!==wasWide){wasWide=w;if(view==='kids'&&!sheetOpen)render();}if(!$('#splash').classList.contains('gone')){drawSplash();return;}clearTimeout(rzT);rzT=setTimeout(fitHome,200);});

/* ================= start ================= */
(function(){const b=$('#langBtn'),m=$('#langMenu');if(!b||!m)return;
  const set=o=>{m.hidden=!o;b.setAttribute('aria-expanded',String(o));};
  b.addEventListener('click',e=>{e.stopPropagation();set(m.hidden);});
  document.addEventListener('click',e=>{if(!m.hidden&&!m.contains(e.target))set(false);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.hidden){set(false);b.focus();}});
})();
$('#goBtn').addEventListener('click',()=>{
  if(!ready)return;
  $('#splash').classList.add('gone');stopSplash();tone(SND.lvl);
  const own=isGuest()?myKids():S.kids;
  if(!own.length){go('kids');if(!needJoin())openKidEditor();}else{go('home');if(!hinted){hinted=true;setTimeout(()=>{if(view==='home'&&!sheetOpen&&!popCtx&&!sel)toast('اضغط على أي شخصية لتضيف لها نقاطًا أو تخصمها');},900);}}
});
(async function init(){
  i18nStart();$$('.langmenu button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===I18N.lang)));drawSplash();$('#goBtn').disabled=true;
  await Promise.race([initStore(),new Promise(r=>setTimeout(r,7000))]);
  await Promise.race([loadAll(),new Promise(r=>setTimeout(r,7000))]);
  ready=true;if(db)subscribe();$('#goBtn').disabled=false;$('#goHint').textContent=db?(isGuest()?'مرحبًا بك في تحدي العائلة':'مرحبًا بك'):'يحفظ بياناتك على هذا الجهاز';
  updateSound();$$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===view)));render();
})();
